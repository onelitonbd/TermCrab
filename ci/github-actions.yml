name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: Smoke CLI (offline mock provider)
        run: |
          export TCRAB_HOME="$RUNNER_TEMP/tcrab-smoke"
          node dist/src/bin/termcrab.js onboard --non-interactive --provider mock --name CICrab
          node dist/src/bin/termcrab.js agent "ping"
          node dist/src/bin/termcrab.js doctor || true
      - name: Package sanity
        run: npm pack --dry-run
